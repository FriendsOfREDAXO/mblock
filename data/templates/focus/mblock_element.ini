<div class="sortitem focus-block<mblock:offline_class/>" data-mblock_index="<mblock:index/>">
    <span class="sorthandle focus-handle" aria-hidden="true"></span>
    <span class="focus-index" aria-hidden="true"></span>
    <span class="removeadded focus-actions">
        <div class="btn-group btn-group-xs">
            <button type="button" class="btn btn-default moveup" title="{{mblock::mblock_move_up}}"><i class="rex-icon rex-icon-up"></i></button>
            <button type="button" class="btn btn-default movedown" title="{{mblock::mblock_move_down}}"><i class="rex-icon rex-icon-down"></i></button>
        </div>
        <div class="btn-group btn-group-xs">
            <button type="button" class="btn btn-default addme" title="{{mblock::mblock_add_element}}"><i class="rex-icon rex-icon-add-module"></i></button>
        </div>
        <mblock:copy_paste_buttons/>
        <mblock:offline_button/>
        <div class="btn-group btn-group-xs">
            <button type="button" class="btn btn-danger removeme" title="{{mblock::mblock_delete_element}}"><i class="rex-icon rex-icon-delete"></i></button>
        </div>
    </span>
    <div class="focus-body"><mblock:form/></div>
</div>
