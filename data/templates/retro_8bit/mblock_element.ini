<div class="sortitem retro-block<mblock:offline_class/>" data-mblock_index="<mblock:index/>">
    <div class="retro-header">
        <span class="sorthandle retro-handle" aria-hidden="true"></span>
        <span class="retro-title">BLOCK <span class="retro-index"></span><span class="retro-cursor" aria-hidden="true"></span></span>
        <span class="retro-state" aria-hidden="true"></span>
        <span class="removeadded retro-actions">
            <div class="btn-group btn-group-xs">
                <button type="button" class="btn btn-default moveup retro-btn" title="{{mblock::mblock_move_up}}">&#9650;</button>
                <button type="button" class="btn btn-default movedown retro-btn" title="{{mblock::mblock_move_down}}">&#9660;</button>
            </div>
            <div class="btn-group btn-group-xs">
                <button type="button" class="btn btn-default addme retro-btn retro-btn-add" title="{{mblock::mblock_add_element}}">+</button>
            </div>
            <mblock:copy_paste_buttons/>
            <mblock:offline_button/>
            <div class="btn-group btn-group-xs">
                <button type="button" class="btn btn-danger removeme retro-btn retro-btn-delete" title="{{mblock::mblock_delete_element}}">&#10006;</button>
            </div>
        </span>
    </div>
    <div class="retro-body"><mblock:form/></div>
</div>
